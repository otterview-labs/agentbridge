name: Android release

# Publishing runs from a tag rather than from main so that the APK people
# download is always traceable to one commit. The Pages download page points at
# /releases/latest/download/agentbridge.apk, which only resolves once a release
# exists, so the asset name here is load-bearing.
on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing android-v* tag to build and publish
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Pinned to the same versions as android/app/build.gradle rather than
          # letting AGP fetch whatever it likes on first run.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Pin Gradle to the upstream distribution host
        # android/gradle/wrapper/gradle-wrapper.properties points at a Tencent
        # mirror, which is the faster host from China but a 130 MB gamble from
        # an Azure runner. Only the host is rewritten so the wrapper stays the
        # single source of truth for the Gradle version.
        run: |
          set -euo pipefail
          props=android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|^distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip|' "$props"
          grep -q '^distributionUrl=https://services.gradle.org/' "$props"

      - name: Unpack the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ASB_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ASB_ANDROID_KEYSTORE_BASE64 is not set. Without it the build silently emits an unsigned APK, which cannot be installed over an existing install."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the release APK
        env:
          ASB_ANDROID_STORE_FILE: ${{ runner.temp }}/release.jks
          ASB_ANDROID_STORE_PASSWORD: ${{ secrets.ASB_ANDROID_STORE_PASSWORD }}
          ASB_ANDROID_KEY_ALIAS: ${{ secrets.ASB_ANDROID_KEY_ALIAS }}
          ASB_ANDROID_KEY_PASSWORD: ${{ secrets.ASB_ANDROID_KEY_PASSWORD }}
          ASB_GRADLE_SKIP_CN_MIRRORS: '1'
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify the APK before it is published
        # assembleRelease succeeds with an unsigned APK when signing material is
        # missing, and a debuggable build would let anyone attach to a process
        # holding SSH credentials. Both are quiet failures, so check for them.
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::expected $apk to exist"; exit 1; }
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/apksigner" verify --print-certs -v "$apk"
          badging=$("$build_tools/aapt2" dump badging "$apk")
          echo "$badging" | head -5
          if grep -q 'application-debuggable' <<<"$badging"; then
            echo "::error::the release APK is debuggable"
            exit 1
          fi

      - name: Stage the release asset
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk agentbridge.apk
          ls -l agentbridge.apk
          sha256sum agentbridge.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" agentbridge.apk --clobber
          else
            gh release create "$TAG" agentbridge.apk \
              --title "agentBridge ${TAG#android-v}" \
              --generate-notes
          fi
