// The Aliyun mirrors are a convenience for building from China. CI runs on
// GitHub's runners, where reaching them buys nothing and adds a slow, second
// way for dependency resolution to fail, so ASB_GRADLE_SKIP_CN_MIRRORS=1 turns
// them off and leaves only the upstream repositories. The check is inlined
// rather than hoisted into a variable because pluginManagement is evaluated
// before the rest of this script, so script locals are not reliably in scope.
pluginManagement {
  repositories {
    if (System.getenv('ASB_GRADLE_SKIP_CN_MIRRORS') != '1') {
      maven { url = uri('https://maven.aliyun.com/repository/gradle-plugin') }
      maven { url = uri('https://maven.aliyun.com/repository/google') }
      maven { url = uri('https://maven.aliyun.com/repository/public') }
    }
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}
dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    if (System.getenv('ASB_GRADLE_SKIP_CN_MIRRORS') != '1') {
      maven { url = uri('https://maven.aliyun.com/repository/google') }
      maven { url = uri('https://maven.aliyun.com/repository/public') }
    }
    google()
    mavenCentral()
  }
}
rootProject.name = 'AgentSessionBridge'
include ':app'
